[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockpulse"
version = "0.1.0"
description = "Bitcoin mempool data pipeline: streaming capture, partitioned Parquet lake with quality checks, SQL analytics, anomaly screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "shellcheck-py==0.10.0.1", "ruff==0.15.0"]
m1 = ["confluent-kafka==2.16.0", "pyarrow==25.0.0"]
ml = ["scikit-learn==1.5.0", "numpy==2.2.6", "scipy==1.13.1", "joblib==1.4.2"]  # pinned: they decide model results
lake = ["pyarrow==25.0.0"]
analytics = ["pyarrow==25.0.0", "duckdb==1.5.6", "pytz==2025.2"]  # duckdb needs pytz to return timestamptz values
m2 = ["psycopg[binary]==3.3.4", "fastapi==0.117.1", "uvicorn==0.37.0"]
all = ["blockpulse[dev,m1,m2,ml,analytics]"]

[project.scripts]
blockpulse = "blockpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockpulse = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
