[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockpulse"
version = "0.1.0"
description = "A small, replayable Bitcoin mempool data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
kafka = ["confluent-kafka==2.16.0"]
m1 = ["confluent-kafka==2.16.0", "pyarrow==25.0.0"]

[project.scripts]
blockpulse = "blockpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

