name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (with Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blockpulse
          POSTGRES_PASSWORD: blockpulse_dev
          POSTGRES_DB: blockpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blockpulse -d blockpulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BLOCKPULSE_TEST_DSN: postgresql://blockpulse:blockpulse_dev@localhost:5432/blockpulse_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Lock file matches pyproject.toml
        run: |
          pip install "uv==0.12.10"
          # Compile on top of the committed lock: uv keeps its pins unless pyproject.toml no longer allows them, so this
          # fails only when declared dependencies change, not whenever an indirect dependency publishes a release.
          cp requirements.lock /tmp/expected.lock
          uv pip compile pyproject.toml --extra all --universal --python-version 3.11 --generate-hashes --no-header --annotation-style line -q -o /tmp/expected.lock
          diff -u requirements.lock /tmp/expected.lock
      - name: Install (exactly the locked versions)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests infra
      - name: Test
        run: pytest -q

  terraform:
    name: Terraform (format, validate, offline tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Test with the mocked AWS provider (no credentials)
        run: terraform test

  instance:
    name: Instance rehearsal (Amazon Linux 2023 containers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        run: shellcheck infra/aws/instance/*.sh infra/aws/tests/*.sh infra/k8s/*.sh
      - name: Install, process, upload, stop, and deadline poweroff under systemd
        run: bash infra/aws/tests/run_container_tests.sh

  kubernetes:
    name: Kubernetes (k3d cluster, chart install, pod-kill drill)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install BlockPulse (exactly the locked versions)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Install k3d
        run: |
          sudo curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          sudo chmod 755 /usr/local/bin/k3d
          k3d version && kubectl version --client && helm version --short
      - name: Create the cluster
        run: bash infra/k8s/cluster-up.sh
      - name: Build the image and load it into the cluster
        run: bash infra/k8s/image-load.sh
      # The drill installs the chart from nothing into its own namespace, generates synthetic traffic in the
      # cluster, force-deletes the worker pod mid-stream, and checks that no message is lost.
      - name: Pod-kill drill (enrichment worker)
        run: python -m blockpulse drill k8s-enrich-kill --output drill-reports
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n blockpulse-drill describe pods || true
          kubectl -n blockpulse-drill logs --all-containers --tail=80 -l app.kubernetes.io/name=blockpulse || true
      - name: Keep the drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-drill-report
          path: drill-reports/
          if-no-files-found: ignore
