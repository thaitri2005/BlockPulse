# Scrapes the BlockPulse workers. They run on the host (or wherever kafka-lake runs with --metrics-port 9108).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: blockpulse-stream-lake
    static_configs:
      - targets: ["host.docker.internal:9108"]
