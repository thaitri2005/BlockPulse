name: blockpulse

services:
  kafka:
    image: apache/kafka:4.3.1
    profiles: [m1]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: "8388608"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "9437184"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    mem_limit: 1g
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17
    profiles: [m2]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: blockpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockpulse_dev}
      POSTGRES_DB: blockpulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockpulse -d blockpulse"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [m2]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockpulse_dev}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-blockpulse_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [m2]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # the workers run on the host
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    mem_limit: 256m
    restart: "no"

  airflow:
    # Orchestrates the batch tier (orchestration/airflow/dags). Postgres comes from the m2 profile; without it the
    # load task fails and retries, which is one of the drills in docs/guides/13-airflow.md.
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    image: blockpulse-airflow:3.3.2
    profiles: [airflow]
    command:
      - bash
      - -c
      - >-
        airflow db migrate
        && airflow pools set blockpulse_data_root 1 "Tasks that write the BlockPulse data root, one at a time"
        && exec airflow standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db  # metadata; LocalExecutor on SQLite is fine for one machine
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # no login; the UI listens on 127.0.0.1 only
      BLOCKPULSE_PIPELINE_ROOT: /opt/blockpulse/data
      BLOCKPULSE_DSN: postgresql://blockpulse:${POSTGRES_PASSWORD:-blockpulse_dev}@postgres:5432/blockpulse_orchestrated
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/blockpulse/src:ro
      - ./analytics:/opt/blockpulse/analytics:ro
      - ./data/orchestrated:/opt/blockpulse/data  # the data root the DAG owns; nothing else under data/ is visible
      - airflow-state:/opt/airflow/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 3g
    restart: "no"

volumes:
  kafka-data:
  postgres-data:
  airflow-state:
