{{- $ctx := dict "root" . "component" "postgres" -}}
{{- $name := include "blockpulse.name" $ctx -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "blockpulse.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
---
# A headless Service (clusterIP: None) gives the pod a stable DNS name, <pod>.<service>, instead of a virtual IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "blockpulse.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "blockpulse.selector" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "blockpulse.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "blockpulse.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "blockpulse.labels" $ctx | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ $name }}
          env:
            # A fresh volume has a lost+found folder at its root on some storage; initdb needs an empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # startup: give a first boot (initdb) or crash recovery time before the other probes count.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            failureThreshold: 60
          # readiness: remove the pod from the Service while it can't answer; it is not restarted.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          # liveness: restart the container if the server process stops answering at all.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  # One PersistentVolumeClaim per pod, named data-<pod>. It outlives the pod, which is what the drills rely on.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
