{{- $ctx := dict "root" . "component" "app" -}}
# The connection string the BlockPulse CLI and API read (BLOCKPULSE_DSN). It contains the password, so it is a
# Secret, not a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blockpulse.name" $ctx }}
  labels: {{- include "blockpulse.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  BLOCKPULSE_DSN: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user (.Values.postgres.password | urlquery) (include "blockpulse.name" (dict "root" . "component" "postgres")) .Values.postgres.database | quote }}
