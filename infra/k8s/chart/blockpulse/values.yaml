# Defaults mirror compose.yaml so the two stacks can be compared: same images, same memory ceilings.
# Override per install with `--set key=value` or `-f my-values.yaml`.

postgres:
  image: postgres:17
  database: blockpulse
  user: blockpulse
  # Development default, the same as Compose. Set a real one for anything reachable by others.
  password: blockpulse_dev
  storage: 2Gi
  resources:
    # requests: what the scheduler reserves. limits: where the kernel throttles CPU or kills for memory.
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

kafka:
  image: apache/kafka:4.3.1
  heapOpts: "-Xms256m -Xmx512m"
  messageMaxBytes: 8388608
  storage: 2Gi
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1Gi}

# The BlockPulse image (infra/k8s/Dockerfile). k3d has no registry here: build it, then load it into the node
# with `k3d image import blockpulse:dev -c blockpulse`. IfNotPresent makes the kubelet use that copy.
app:
  image: blockpulse:dev
  pullPolicy: IfNotPresent

api:
  replicas: 2  # stateless, so any number can run; two shows a Service spreading requests and surviving a pod kill
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# The enrichment worker calls a public REST API within a request budget, so it is off by default and never runs
# more than one copy (decision D08). Turn it on with `--set worker.replicas=1`.
worker:
  replicas: 0
  groupId: blockpulse-enrich
  apiBase: https://mempool.space/api
  requestsPerSecond: 1
  maxRequests: 100
  # The worker exits when its topic has been quiet this long (seconds); Kubernetes then starts it again.
  idleTimeout: 3600
  metricsPort: 9109
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 384Mi}

grafana:
  image: grafana/grafana:12.2.0
  adminUser: admin
  adminPassword: blockpulse_dev  # development default, as in Compose
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 384Mi}

# The stream sink: reads the enriched topic and writes the lake tables to its volume (blockpulse kafka-lake).
# It calls nothing outside the cluster, so it is on by default; it simply idles until the worker produces.
sink:
  replicas: 1
  groupId: blockpulse-stream-lake
  storage: 2Gi
  idleTimeout: 3600
  metricsPort: 9108
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

prometheus:
  image: prom/prometheus:v3.5.0
  retention: 7d
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# Scheduled upkeep of the streamed lake, run next to the sink's volume.
maintenance:
  schedule: "7 * * * *"      # every hour at minute 7, after the previous hour has closed
  # Also rebuild Postgres from the streamed lake after compacting. Off by default because it replaces what the
  # API and dashboards serve with the streamed data only.
  serveStreamedLake: false
